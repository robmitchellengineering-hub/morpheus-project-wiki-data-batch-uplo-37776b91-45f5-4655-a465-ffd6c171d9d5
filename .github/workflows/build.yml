name: Build

on:
  workflow_dispatch:
  # TEMPORARY: this branch only, so the architecture fix can be built and verified before it is merged.
  # Removed before the pull request — `workflow_dispatch` is the deliberate trigger on main.
  push:
    branches: [fix/macos-intel-build]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macOS appears TWICE, on purpose, and the reason is one-directional:
        # `macos-latest` is Apple Silicon (arm64) and an arm64 build CANNOT run on an Intel Mac — the
        # failure is `Bad CPU type in executable`, with nothing in the build log to explain it. An Intel
        # (x86_64) build runs natively on Intel and on Apple Silicon through Rosetta. So both are built
        # and the operator installs their machine's. Until this change the only macOS artifact was arm64,
        # which could not be installed on the Intel Mac it was built for. (`macos-13` is the older Intel label
        # and now sits queued forever — GitHub is retiring it — so the Intel entry is `macos-15-intel`.)
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements-lock.txt
      # PyQt6's wheels link these at load time. Without them the frozen binary dies
      # with `ImportError: libEGL.so.1` before main.py runs, whichever platform
      # plugin it is asked for.
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0
      # Before the build, not after: a duplicate checker that raises on the pinned
      # pandas produced a clean build and a broken app once already. These are the
      # tests for the faults that shipped.
      - name: Run behaviour tests
        shell: bash
        run: python -m unittest discover -s tests -v
      - name: Build with the project's own build script
        shell: bash
        run: |
          python build.py
          ls -la dist || true
      - name: Windows smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\WikiDataBatchUploader.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($proc.HasExited) {
            Write-Error "Application exited early during smoke test."
            exit 1
          }
          Stop-Process -Id $proc.Id -Force
      # WHAT CANNOT BE CHECKED HERE, so nobody tries again: the macOS build is WINDOWED, and PyInstaller's
      # windowed bootloader exits 255 before Python starts when there is no window server. So `--diagnose`,
      # which import-tests every module and would be the obvious smoke test, cannot run on a headless macOS
      # runner at all — the first version of this step did exactly that and could never have passed. A
      # functional macOS check needs a Mac with a desktop; that is a real limit, not an omission.
      #
      # AND THE macOS ARTIFACT IS CURRENTLY BROKEN REGARDLESS OF ARCHITECTURE (measured 2026-09-30 on an
      # Intel Mac): launching it dies during --onefile extraction with
      #   "Failed to extract PyQt6/Qt6/lib/QtBluetooth.framework/Resources/Info.plist: File exists"
      # because Qt frameworks are symlink-heavy and the archive carries both the symlink and its target.
      # Excluding the MODULE does not help — the framework is collected as DATA, which is why
      # `--exclude-module PyQt6.QtBluetooth` changed nothing. The fix is `--onedir` for macOS. This step
      # cannot see any of that, which is exactly how it shipped as "NOT VERIFIED" on both architectures.
      #
      # WHAT CAN BE CHECKED, and is the thing that actually went wrong: the ARCHITECTURE. The macOS artifact
      # was arm64-only (built on `macos-latest`, which is Apple Silicon), and an arm64 build cannot run on an
      # Intel Mac — `Bad CPU type in executable`, with nothing in the build log to explain it. Asserting the
      # architecture we asked for turns that silent mismatch into a failed build.
      - name: macOS architecture is the one we asked for
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          archs=$(lipo -archs dist/WikiDataBatchUploader)
          echo "built: $archs   runner: $(uname -m)   requested: ${{ matrix.os }}"
          case "${{ matrix.os }}" in
            *intel*) case "$archs" in *x86_64*) ;; *) echo "::error::asked for Intel, got '$archs'"; exit 1;; esac ;;
            *)       case "$archs" in *arm64*)  ;; *) echo "::error::asked for Apple Silicon, got '$archs'"; exit 1;; esac ;;
          esac

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: dist/*
