name: Build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macOS appears TWICE, on purpose, and the reason is one-directional:
        # `macos-latest` is Apple Silicon (arm64) and an arm64 build CANNOT run on an Intel Mac — the
        # failure is `Bad CPU type in executable`, with nothing in the build log to explain it. An Intel
        # (x86_64) build runs natively on Intel and on Apple Silicon through Rosetta. So both are built
        # and the operator installs their machine's. Until this change the only macOS artifact was arm64,
        # which could not be installed on the Intel Mac it was built for.
        os: [ubuntu-latest, windows-latest, macos-13, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements-lock.txt
      # PyQt6's wheels link these at load time. Without them the frozen binary dies
      # with `ImportError: libEGL.so.1` before main.py runs, whichever platform
      # plugin it is asked for.
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0
      # Before the build, not after: a duplicate checker that raises on the pinned
      # pandas produced a clean build and a broken app once already. These are the
      # tests for the faults that shipped.
      - name: Run behaviour tests
        shell: bash
        run: python -m unittest discover -s tests -v
      - name: Build with the project's own build script
        shell: bash
        run: |
          python build.py
          ls -la dist || true
      - name: Windows smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\WikiDataBatchUploader.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($proc.HasExited) {
            Write-Error "Application exited early during smoke test."
            exit 1
          }
          Stop-Process -Id $proc.Id -Force
      # `--diagnose` import-tests every module and prints a summary, but it NEVER exits non-zero — it
      # writes a report and carries on. So "it ran" is not "it passed", and a bundle with dead imports
      # would ship green: the step has to READ the summary and fail on it (hazard H17). This is also the
      # macOS check the build has never had. The windowed .app's bootloader cannot start without a window
      # session, but the same bundle's payload can still be exercised offscreen.
      - name: macOS verification (headless)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -o pipefail
          test -x dist/WikiDataBatchUploader
          echo "verifying $(lipo -archs dist/WikiDataBatchUploader 2>/dev/null || echo 'arch?') on $(uname -m)"
          QT_QPA_PLATFORM=offscreen ./dist/WikiDataBatchUploader --diagnose 2>&1 | tee diag.txt
          grep -qE "Import summary: [0-9]+ succeeded, 0 failed\." diag.txt

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: dist/*
