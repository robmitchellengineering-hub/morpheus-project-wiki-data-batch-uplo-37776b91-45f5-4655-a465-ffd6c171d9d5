name: Build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements-lock.txt
      # Before the build, not after: a duplicate checker that raises on the pinned
      # pandas produced a clean build and a broken app once already. These are the
      # tests for the faults that shipped.
      - name: Run behaviour tests
        shell: bash
        run: python -m unittest discover -s tests -v
      - name: Build with the project's own build script
        shell: bash
        run: |
          python build.py
          ls -la dist || true
      - name: Windows smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\WikiDataBatchUploader.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($proc.HasExited) {
            Write-Error "Application exited early during smoke test."
            exit 1
          }
          Stop-Process -Id $proc.Id -Force
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: dist/*
