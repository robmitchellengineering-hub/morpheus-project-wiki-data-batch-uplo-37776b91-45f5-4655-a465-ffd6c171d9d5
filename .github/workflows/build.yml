name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements-lock.txt
      - name: Build with the project's own build script
        run: |
          python build.py
          if (-not (Get-ChildItem dist -ErrorAction SilentlyContinue)) { Write-Error "Build script produced nothing in dist/"; exit 1 }
          Compress-Archive -Path dist\* -DestinationPath release.zip
      - name: Verify artifact
        run: |
          if (-not (Test-Path release.zip)) { Write-Error "No executable archive produced"; exit 1 }
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_id }}
          files: release.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
